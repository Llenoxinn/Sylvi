<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: 'Geist', sans-serif; color: #16201b; background: #f3f5f4; position: relative; }
  nav { position: absolute; top: 22px; left: 72px; right: 72px; display: flex; align-items: center; gap: 28px; font-size: 15px; color: #4c5852; }
  nav b { font-size: 19px; color: #16201b; margin-right: auto; }
  nav .cta { background: #c2185b; color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 600; }
  h1 { position: absolute; left: 72px; top: 92px; font-size: 72px; line-height: 1; letter-spacing: -.035em; font-weight: 600; }
  .act { position: absolute; right: 72px; top: 112px; display: flex; gap: 12px; align-items: center; }
  .btn { font-size: 18px; font-weight: 600; padding: 15px 26px; border-radius: 999px; background: #c2185b; color: #fff; }
  /* One order made two ways; the handle splits them and drags to compare. */
  .split { position: absolute; left: 72px; right: 72px; top: 230px; height: 620px; border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr;
    box-shadow: 0 0 0 1px #d6ddd9; }
  .word { background: #e9ecef; position: relative; }
  .word .bar { height: 46px; background: #2b579a; color: #fff; font-size: 15px; padding: 14px 20px; }
  .word .page { position: absolute; left: 90px; top: 86px; width: 360px; height: 500px; background: #fff; box-shadow: 0 2px 8px rgb(0 0 0 / .15); }
  .wp { position: absolute; background: #d4dad6; border: 1px dashed #8a99a0; }
  .label { position: absolute; bottom: 22px; left: 24px; font-size: 18px; font-weight: 600; background: #fff; padding: 6px 12px; border-radius: 6px; }
  .sylvi { background: #24443b; position: relative;
    background-image: linear-gradient(rgb(255 255 255 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .06) 1px, transparent 1px);
    background-size: 24px 24px; }
  .sheet { position: absolute; left: 150px; top: 70px; width: 330px; height: 495px; background: #f6f7f5; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); gap: 1px;
    box-shadow: 0 30px 60px -20px rgb(0 0 0 / .6); }
  .ph { background: #dfe6e2; }
  .big { grid-column: span 2; grid-row: span 2; }
  .sylvi .label { background: #c2185b; color: #fff; left: auto; right: 24px; }
  .handle { position: absolute; left: 50%; top: 230px; bottom: 50px; width: 3px; background: #c2185b; translate: -1.5px 0; }
  .knob { position: absolute; left: 50%; top: 500px; width: 54px; height: 54px; border-radius: 50%; background: #c2185b; translate: -50% 0; box-shadow: 0 6px 16px -4px rgb(0 0 0 / .4); }
</style>
</head>
<body>
  <nav><b>Sylvi</b><span>How it works</span><span>Packages</span><span>Questions</span><span class="cta">Open Sylvi</span></nav>
  <h1>Same order. Two ways to make it.</h1>
  <div class="act"><span class="btn">Open Sylvi, free</span></div>
  <section class="split">
    <div class="word">
      <div class="bar">Document1 - Word</div>
      <div class="page">
        <span class="wp" style="left:30px;top:34px;width:118px;height:118px;rotate:2deg"></span>
        <span class="wp" style="left:160px;top:40px;width:112px;height:122px"></span>
        <span class="wp" style="left:26px;top:168px;width:124px;height:110px;rotate:-1.5deg"></span>
        <span class="wp" style="left:40px;top:300px;width:58px;height:62px"></span>
        <span class="wp" style="left:104px;top:296px;width:60px;height:56px;rotate:3deg"></span>
        <span class="wp" style="left:172px;top:304px;width:58px;height:58px"></span>
      </div>
      <span class="label">In Word: by hand, by eye</span>
    </div>
    <div class="sylvi">
      <div class="sheet"><div class="ph big"></div><div class="ph big"></div><div class="ph big"></div><div class="ph big"></div>
        <div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>
      <span class="label">In Sylvi: packed and marked</span>
    </div>
  </section>
  <span class="handle"></span><span class="knob"></span>
</body>
</html>
