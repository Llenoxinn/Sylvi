<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: 'Geist', sans-serif; color: #f4f8f6; background: #24443b; position: relative;
    background-image: linear-gradient(rgb(255 255 255 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .06) 1px, transparent 1px);
    background-size: 24px 24px; }
  nav { position: absolute; top: 22px; left: 72px; right: 72px; display: flex; align-items: center; gap: 28px; font-size: 15px; color: #e8f2ed; }
  nav b { font-size: 19px; color: #f4f8f6; margin-right: auto; }
  nav .cta { background: #c2185b; color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 600; }
  h1 { position: absolute; left: 72px; top: 96px; font-size: 76px; line-height: 1; letter-spacing: -.035em; font-weight: 600; width: 1000px; }
  /* The shop's menu board: one row per package, big letter, contents; the chosen row is lit. */
  .board { position: absolute; left: 72px; top: 268px; width: 700px; background: #1c372f; border-radius: 8px; padding: 16px 0;
    box-shadow: 0 24px 48px -20px rgb(0 0 0 / .6), inset 0 0 0 1px rgb(255 255 255 / .07); }
  .row { display: grid; grid-template-columns: 96px 1fr 64px; align-items: center; height: 70px; padding: 0 28px; border-bottom: 1px solid rgb(255 255 255 / .06); }
  .row:last-child { border-bottom: 0; }
  .row b { font-size: 40px; letter-spacing: -.02em; }
  .row span { font-size: 22px; color: rgb(232 242 237 / .82); }
  .row i { font-style: normal; width: 34px; height: 44px; border: 2px solid rgb(232 242 237 / .4); border-radius: 2px; justify-self: end; }
  .row.on { background: color-mix(in oklab, #f06a9b 18%, #1c372f); box-shadow: inset 4px 0 0 #f06a9b; }
  .row.on b { color: #f06a9b; }
  .row.on i { border-color: #f06a9b; background: rgb(240 106 155 / .25); }
  .act { position: absolute; left: 72px; top: 812px; display: flex; gap: 14px; align-items: center; }
  .btn { font-size: 18px; font-weight: 600; padding: 15px 26px; border-radius: 999px; }
  .btn.p { background: #c2185b; color: #fff; }
  .act p { font-size: 17px; color: rgb(232 242 237 / .75); }
  /* The chosen package's real 4R sheet, measured, with its cuts marked. */
  .sheet { position: absolute; left: 910px; top: 250px; width: 380px; height: 570px; background: #f6f7f5; display: grid;
    grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr); gap: 1px; box-shadow: 0 30px 60px -20px rgb(0 0 0 / .6); }
  .ph { background: #dfe6e2; position: relative; overflow: hidden; }
  .ph::before { content: ''; position: absolute; left: 50%; top: 20%; width: 40%; aspect-ratio: 1; border-radius: 50%; background: #b5c2bb; translate: -50% 0; }
  .ph::after { content: ''; position: absolute; left: 50%; bottom: -12%; width: 82%; height: 42%; border-radius: 50% 50% 0 0; background: #b5c2bb; translate: -50% 0; }
  .big { grid-column: span 2; grid-row: span 2; }
  .dim { position: absolute; color: #e8f2ed; font-size: 14px; font-weight: 600; }
  .tag { position: absolute; left: 910px; top: 206px; font-size: 22px; font-weight: 600; color: #f4f8f6; }
  .tag span { color: rgb(232 242 237 / .7); font-weight: 400; }
</style>
</head>
<body>
  <nav><b>Sylvi</b><span>How it works</span><span>Questions</span><span class="cta">Open Sylvi</span></nav>
  <h1>Your menu board, already laid out.</h1>
  <section class="board">
    <div class="row"><b>A</b><span>2 × 2x2, 7 × 1x1</span><i></i></div>
    <div class="row on"><b>B</b><span>4 × 2x2, 8 × 1x1</span><i></i></div>
    <div class="row"><b>C</b><span>4 × passport, 6 × 1x1</span><i></i></div>
    <div class="row"><b>D</b><span>8 × passport</span><i></i></div>
    <div class="row"><b>1x1</b><span>A whole sheet of 1x1</span><i></i></div>
    <div class="row"><b>2x2</b><span>A whole sheet of 2x2</span><i></i></div>
  </section>
  <div class="act"><span class="btn p">Make Package B in Sylvi</span><p>Free. Photos never leave the computer.</p></div>
  <p class="tag">Package B <span>on one 4R sheet</span></p>
  <section class="sheet">
    <div class="ph big"></div><div class="ph big"></div><div class="ph big"></div><div class="ph big"></div>
    <div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div>
    <div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div>
  </section>
  <span class="dim" style="left:1300px;top:520px">6 in</span>
  <span class="dim" style="left:1084px;top:830px">4 in</span>
</body>
</html>
